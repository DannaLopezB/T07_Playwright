<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@400;700&display=swap" rel="stylesheet">
  <title>Formulario</title>
</head>
<body>
  <section class="contact">
    <div class="u-wrapper">
      <div class="contact-content">

        <form id="form" action="" class="form">
          <h3 class="tag"><span>FORMULARIO</span></h3>
          <label for="name">Nombre Completo <span>*</span></label>
            <input name="name" required type="text" id="name" placeholder="Danna">
          <label for="email">Correo electrónico <span>*</span></label>
            <input name="email" type="text" id="email" required placeholder="danna@gmail.com">
          <label for="message">Mensaje</label>
            <textarea id="message" name="message" id="" cols="30" rows="10"></textarea>
          <button type="submit" class="btn primary full">ENVIAR FORMULARIO</button>
        </form>
        <a href="mailto:danna.lopez@vallegrande.edu.pe" id="trucazo"></a>
      </div>
    </div>
  </section>
  <script>
    const $form = document.querySelector('#form')
    const $buttonMailto = document.querySelector('#trucazo')

    $form.addEventListener('submit', handleSubmit)

    function handleSubmit(event) {
      event.preventDefault()
      const form = new FormData(this)
      $buttonMailto.setAttribute('href', `mailto:danna.lopez@vallegrande.edu.pe?subject=nombre ${form.get('name')}  correo ${form.get('email')}&body=${form.get('message')}`)
      $buttonMailto.click()
    }
  </script>



</body>
</html>
